[package]
name = "kaydence"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Kaydence — local-first cross-platform AI dictation."
default-run = "kaydence"

[lib]
name = "kaydence_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
cpal = "0.17"
ringbuf = "0.5"
rubato = "1"
audioadapter-buffers = "2"

# Real ASR engine (P1-P0-2, ADR-0014). whisper.cpp bindings, MIT. OFF by default:
# the `asr-whisper` feature opts the native C++ compile in so the default build
# and CI stay fast and dependency-light until per-OS acceleration is matrix-proven.
# Loads a checksum-verified LOCAL ggml model — adds NO network surface (model
# download is a separate still-gated decision, ADR-0014 §4). audit-network stays green.
whisper-rs = { version = "0.16", optional = true }
# Model download-on-demand (P1-P0-2/P1-P0-8, ADR-0015). The ONE model-fetch
# network surface, OFF by default. ureq = minimal pure-Rust blocking client
# (rustls). Fetches only registry-pinned HTTPS sources; verify-before-install.
ureq = { version = "2", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"

# Linux text injection (P1-P0-3, ADR-0013). AT-SPI = native insert + the
# secure-field signal (non-negotiable #8). atspi uses zbus/async-io; pollster
# drives it synchronously without pulling a tokio runtime into the inject path.
# NOT a network surface — audit-network stays green.
[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.30"
pollster = "0.4"
zbus = "5"
futures-lite = "2"
# uinput keystroke synthesis — the validated primary insertion path on Wayland
# (AT-SPI InsertText no-ops on modern GNOME; ADR-0013 amendment). Local device
# I/O, not a network surface.
evdev = "0.13"

# Windows text injection (P1-P0-3, ADR-0013). UI Automation = the secure-field
# signal (IsPassword, non-negotiable #8) AND the native insertion path
# (ValuePattern.SetValue — works on Windows, unlike AT-SPI on GNOME); SendInput
# KEYEVENTF_UNICODE is the keystroke fallback. Microsoft's official bindings,
# version already in-tree via tauri (0.61.x in Cargo.lock — no new version).
# Local OS input/COM APIs only — NOT a network surface; audit-network stays green.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSString"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Feature-gated network surfaces stay OFF by default (non-negotiable #1).
byok = []
relay = []
# Real whisper.cpp ASR adapter (ADR-0014). OFF by default — opts the native
# whisper.cpp compile in. Not a network surface (loads a local verified model).
asr-whisper = ["dep:whisper-rs"]
# macOS-only acceleration proof lane. Keep separate from `asr-whisper` so
# Windows/Linux CPU builds never inherit Metal linkage through feature unification.
asr-whisper-metal = ["asr-whisper", "whisper-rs/metal"]
# Model download-on-demand (ADR-0015). OFF by default — opts the ureq client +
# the single models/download call site in. Default build stays zero-egress.
model-download = ["dep:ureq"]
