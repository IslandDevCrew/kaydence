# Kaydence Cargo workspace (P0-T2). Members grow as crates gain manifests;
# crates/* stay empty until a second consumer exists (crates/AGENTS.md).
[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
strip = true
lto = true
codegen-units = 1
