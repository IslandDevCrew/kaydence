name: ci
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # non-negotiable #5 (ADR-0011) — 3-OS, permanent. Linux needs display-server +
        # injection deps; Wayland/X11 injection tests run headless where possible.
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      # --- Rust backend ---
      - name: fmt
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: test
        run: cargo test --all
        working-directory: apps/desktop/src-tauri
      # --- Frontend ---
      - name: install
        run: npm ci
        working-directory: apps/desktop
      - name: typecheck + lint
        run: npm run check
        working-directory: apps/desktop
      # --- Gates (bash on all three runners incl. Windows Git Bash) ---
      - name: network audit (non-negotiable #1)
        shell: bash
        run: bash scripts/audit-network.sh
      - name: ADR status (P0-G7)
        shell: bash
        run: bash scripts/check-adr-status.sh
      - name: latency budget (root §5)
        shell: bash
        # exit 3 = not-measurable-yet (pre-build); only a real regression (exit 1) fails CI.
        run: bash scripts/bench.sh --check || test $? -eq 3
