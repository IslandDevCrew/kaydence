name: ci
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]   # non-negotiable #5 — permanent
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      # --- Rust backend ---
      - name: fmt
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: test
        run: cargo test --all
        working-directory: apps/desktop/src-tauri
      # --- Frontend ---
      - name: install
        run: npm ci
        working-directory: apps/desktop
      - name: typecheck + lint
        run: npm run check
        working-directory: apps/desktop
      # --- Gates (enable as scripts land) ---
      # - name: network audit (non-negotiable #1)
      #   run: bash scripts/audit-network.sh
      # - name: latency budget (root §5)
      #   run: bash scripts/bench.sh --check
