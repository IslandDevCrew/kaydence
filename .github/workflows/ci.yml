name: ci
# Cost-aware triggers (metered private-repo Actions; macOS bills ×10, Windows ×2):
#   - push to main .......... Linux only (×1) — the cheap everyday gate
#   - pull_request to main .. full 3-OS — the trust anchor before a merge
#   - workflow_dispatch ..... full 3-OS, or Windows-only native visual proof
# This keeps non-negotiable #5 (ADR-0011, 3-OS) intact where it matters — every
# merge to main goes through a PR that runs all three — while heartbeat pushes
# stop burning the ×10 macOS runner. Removing the old `on: [push, pull_request]`
# also ends the duplicate-run waste (was 6 jobs per branch push, now Linux-only).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_visual_proof:
        description: Build and capture the native Windows Tauri/WebView screen family
        required: false
        default: false
        type: boolean

jobs:
  # Emits the OS matrix: Linux-only for pushes, all three otherwise.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.windows_visual_proof }}" = "true" ]; then
            echo 'matrix={"os":["windows-latest"]}' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo 'matrix={"os":["ubuntu-latest"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-latest","windows-latest","macos-latest"]}' >> "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: setup
    env:
      # Do not let whisper.cpp bind shipped adapter checks or proof binaries to
      # whichever instruction set happens to back the hosted runner.
      GGML_NATIVE: "OFF"
    strategy:
      fail-fast: false
      # non-negotiable #5 (ADR-0011) — 3-OS, permanent — enforced on every PR to
      # main and on ordinary manual dispatch. The explicit Windows visual-proof
      # dispatch is evidence-only and follows a green 3-OS merge parent. Linux
      # needs display-server + injection deps; Wayland/X11 injection tests run
      # headless where possible.
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Windows WebView proof harness contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path "scripts/windows-webview-proof.ps1").Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host "PowerShell syntax contract passed: $path"
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - name: enable pnpm
        run: corepack enable
        shell: bash
        env: { COREPACK_ENABLE_DOWNLOAD_PROMPT: "0" }
      # --- Linux system deps (P0-T5, ADR-0011): Tauri 2.x webview + tray +
      #     gtk-layer-shell for the HUD overlay (ADR-0004 study). CANNOT be
      #     verified on the current macOS-only host — waived-pending-infra. ---
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-layer-shell-dev \
            libasound2-dev \
            patchelf
      # --- Rust backend ---
      - name: fmt
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: test
        run: cargo test --all
        working-directory: apps/desktop/src-tauri
      - name: select shipped ASR feature
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "KAYDENCE_SHIPPED_ASR_FEATURE=asr-whisper-metal" >> "$GITHUB_ENV"
          else
            echo "KAYDENCE_SHIPPED_ASR_FEATURE=asr-whisper" >> "$GITHUB_ENV"
          fi
      - name: clippy shipped ASR adapter
        shell: bash
        run: cargo clippy --all-targets --features "$KAYDENCE_SHIPPED_ASR_FEATURE" -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: test shipped ASR adapter
        shell: bash
        run: cargo test --all-targets --features "$KAYDENCE_SHIPPED_ASR_FEATURE"
        working-directory: apps/desktop/src-tauri
      # --- Frontend (pnpm workspace) ---
      - name: install
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: typecheck + lint
        shell: bash
        run: bash scripts/check-frontend.sh
      - name: macOS build/run harness contract
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/build_and_run.sh
      # --- Gates (bash on all three runners incl. Windows Git Bash) ---
      - name: network audit (non-negotiable #1)
        shell: bash
        run: bash scripts/audit-network.sh
      - name: privacy posture (P1-P0-7)
        shell: bash
        run: bash scripts/check-privacy-posture.sh --check
      - name: ADR status (P0-G7)
        shell: bash
        run: bash scripts/check-adr-status.sh
      - name: latency budget (root §5)
        shell: bash
        run: bash scripts/bench.sh --check
      - name: build Windows native WebView proof binary
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.windows_visual_proof == true
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "ops\mission\evidence\windows-webview-proof"
          $null = New-Item -ItemType Directory -Force -Path $output
          pnpm --filter kaydence-desktop build
          if ($LASTEXITCODE -ne 0) {
            "Frontend build failed with exit code $LASTEXITCODE." | Set-Content (Join-Path $output "build-failure.txt")
            exit $LASTEXITCODE
          }
          cargo build --release --features custom-protocol,asr-whisper --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) {
            "Native release build failed with exit code $LASTEXITCODE." | Set-Content (Join-Path $output "build-failure.txt")
            exit $LASTEXITCODE
          }
      - name: capture Windows native WebView proof
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.windows_visual_proof == true
        shell: pwsh
        run: |
          ./scripts/windows-webview-proof.ps1 `
            -ExecutablePath "target\release\kaydence.exe" `
            -OutputDirectory "ops\mission\evidence\windows-webview-proof"
      - name: upload Windows native WebView proof
        if: always() && runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.windows_visual_proof == true
        uses: actions/upload-artifact@v4
        with:
          name: kaydence-windows-webview-proof-${{ github.sha }}
          path: ops/mission/evidence/windows-webview-proof/**
          if-no-files-found: error
          retention-days: 14
