name: ci
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # non-negotiable #5 (ADR-0011) — 3-OS, permanent. Linux needs display-server +
        # injection deps; Wayland/X11 injection tests run headless where possible.
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - name: enable pnpm
        run: corepack enable
        shell: bash
      # --- Linux system deps (P0-T5, ADR-0011): Tauri 2.x webview + tray +
      #     gtk-layer-shell for the HUD overlay (ADR-0004 study). CANNOT be
      #     verified on the current macOS-only host — waived-pending-infra. ---
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-layer-shell-dev \
            patchelf
      # --- Rust backend ---
      - name: fmt
        run: cargo fmt --all -- --check
        working-directory: apps/desktop/src-tauri
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: test
        run: cargo test --all
        working-directory: apps/desktop/src-tauri
      # --- Frontend (pnpm workspace) ---
      - name: install
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: typecheck + lint
        shell: bash
        run: bash scripts/check-frontend.sh
      # --- Gates (bash on all three runners incl. Windows Git Bash) ---
      - name: network audit (non-negotiable #1)
        shell: bash
        run: bash scripts/audit-network.sh
      - name: ADR status (P0-G7)
        shell: bash
        run: bash scripts/check-adr-status.sh
      - name: latency budget (root §5)
        shell: bash
        # exit 3 = not-measurable-yet (pre-build); only a real regression (exit 1) fails CI.
        run: bash scripts/bench.sh --check || test $? -eq 3
